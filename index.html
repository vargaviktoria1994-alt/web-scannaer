<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Webes PDF Eszköz</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; color: #333; margin: 0; padding: 10px; text-align: center; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 15px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        
        /* Gombok stílusa */
        button, .btn { background: #1a73e8; color: white; border: none; padding: 12px 15px; margin: 5px; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; width: 100%; max-width: 300px; box-sizing: border-box; }
        .btn-success { background: #388e3c; }
        .btn-danger { background: #d32f2f; }
        
        /* Kamera */
        .camera-wrapper { position: relative; display: none; margin: 10px auto; width: 100%; overflow: hidden; background: #000; min-height: 250px; border-radius: 8px; }
        video { width: 100%; height: auto; display: block; object-fit: contain; }
        .scanner-guide { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 85%; max-width: 320px; aspect-ratio: 210/297; border: 3px solid #ff9800; box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.6); pointer-events: none; }

        .ui-section { margin: 15px 0; border: 1px solid #eee; border-radius: 10px; padding: 10px; background: #fff; }
        .controls { text-align: left; font-size: 14px; }
        input[type="range"] { width: 100%; margin-top: 5px; }
        input[type="text"] { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; text-align: center; margin: 10px 0; }
        
        .gallery { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 15px; justify-content: center; }
        .gallery-item { position: relative; }
        .gallery img { height: 80px; border: 2px solid #ddd; border-radius: 6px; }
        .remove-btn { position: absolute; top: -5px; right: -5px; background: #d32f2f; color: white; border-radius: 50%; width: 20px; height: 20px; border: none; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>📄 Webes PDF Eszköz</h2>
    
    <button id="startCameraBtn">📷 Kamera Indítása</button>
    
    <div class="camera-wrapper" id="cameraWrapper">
        <video id="video" autoplay playsinline></video>
        <div class="scanner-guide"></div>
    </div>

    <button id="captureBtn" class="btn-success" style="display: none; width: 100%; max-width: 300px;">📸 Kép készítése</button>
    
    <div class="ui-section">
        <!-- Fájlfeltöltés gombként -->
        <label for="imageUpload" class="btn btn-success" style="width: 100%; max-width: 100%;">📁 Képek Feltöltése</label>
        <input type="file" id="imageUpload" accept="image/*" multiple style="display:none;">
        
        <div class="controls">
            <p><b>Színmód:</b><br>
            <input type="radio" name="colorMode" value="color" checked> Színes
            <input type="radio" name="colorMode" value="bw"> Fekete-fehér</p>
            
            <p><b>PDF Tömörítés:</b><br>
            <input type="range" id="compression" min="0.1" max="1.0" step="0.1" value="0.6">
            <div id="compValue" style="text-align: right; font-size: 12px; color: #666;">Közepes minőség (0.6)</div></p>
        </div>

        <div style="background: #e3f2fd; padding: 10px; border-radius: 8px; font-size: 13px; font-weight: bold;">
            Oldalak: <span id="pageCount">0</span> | Méret: <span id="estSize">0.00 MB</span>
        </div>

        <div class="gallery" id="gallery"></div>
    </div>

    <input type="text" id="fileNameInput" placeholder="Fájlnév">
    <div style="display: flex; gap: 5px;">
        <button id="clearBtn" class="btn-danger" disabled>🗑️ Törlés</button>
        <button id="downloadBtn" class="btn-success" disabled>⬇️ Letöltés</button>
    </div>
</div>

<canvas id="canvas" style="display: none;"></canvas>

<script>
    const video = document.getElementById('video'), canvas = document.getElementById('canvas'), ctx = canvas.getContext('2d');
    const gallery = document.getElementById('gallery'), pages = [];
    
    // Kamera
    document.getElementById('startCameraBtn').onclick = async () => {
        stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: { ideal: 4096 }, height: { ideal: 2160 } } });
        video.srcObject = stream;
        document.getElementById('cameraWrapper').style.display = 'block';
        document.getElementById('captureBtn').style.display = 'inline-flex';
        document.getElementById('startCameraBtn').style.display = 'none';
    };

    // Fotózás
    document.getElementById('captureBtn').onclick = () => {
        const vW = video.videoWidth, vH = video.videoHeight, dW = video.clientWidth, dH = video.clientHeight;
        const gW = document.querySelector('.scanner-guide').clientWidth, gH = document.querySelector('.scanner-guide').clientHeight;
        const scaleX = vW / dW, scaleY = vH / dH;
        canvas.width = gW * scaleX; canvas.height = gH * scaleY;
        ctx.drawImage(video, (vW - canvas.width) / 2, (vH - canvas.height) / 2, canvas.width, canvas.height, 0, 0, canvas.width, canvas.height);
        processAndCompress(canvas.toDataURL('image/jpeg', 1.0));
    };

    // Feltöltés
    document.getElementById('imageUpload').onchange = (e) => {
        Array.from(e.target.files).forEach(file => {
            const reader = new FileReader();
            reader.onload = (ev) => processAndCompress(ev.target.result);
            reader.readAsDataURL(file);
        });
    };

    function processAndCompress(src) {
        const img = new Image();
        img.src = src;
        img.onload = () => {
            const tempC = document.createElement('canvas');
            const MAX_H = 1800;
            const ratio = img.height > MAX_H ? MAX_H / img.height : 1;
            tempC.width = img.width * ratio; tempC.height = img.height * ratio;
            const tCtx = tempC.getContext('2d');
            tCtx.drawImage(img, 0, 0, tempC.width, tempC.height);

            // JAVÍTÁS: Fekete-fehér mód biztosítása
            if (document.querySelector('input[name="colorMode"]:checked').value === 'bw') {
                let imgData = tCtx.getImageData(0, 0, tempC.width, tempC.height);
                for (let i = 0; i < imgData.data.length; i += 4) {
                    let avg = (imgData.data[i] + imgData.data[i+1] + imgData.data[i+2]) / 3;
                    imgData.data[i] = imgData.data[i+1] = imgData.data[i+2] = avg > 120 ? 255 : 0;
                }
                tCtx.putImageData(imgData, 0, 0);
            }
            
            pages.push(tempC.toDataURL('image/jpeg', parseFloat(document.getElementById('compression').value)));
            updateUI();
            
            // AUTOMATIKUS GÖRGETÉS
            setTimeout(() => {
                document.getElementById('gallery').lastElementChild?.scrollIntoView({ behavior: 'smooth' });
            }, 100);
        };
    }

    function updateUI() {
        gallery.innerHTML = '';
        pages.forEach((src, i) => {
            const div = document.createElement('div'); div.className = 'gallery-item';
            const img = document.createElement('img'); img.src = src;
            const btn = document.createElement('button'); btn.innerHTML = '×'; btn.className = 'remove-btn';
            btn.onclick = () => { pages.splice(i, 1); updateUI(); };
            div.appendChild(img); div.appendChild(btn); gallery.appendChild(div);
        });
        document.getElementById('pageCount').innerText = pages.length;
        document.getElementById('estSize').innerText = (pages.length * 0.5).toFixed(2) + ' MB'; // Becslés
        document.getElementById('downloadBtn').disabled = document.getElementById('clearBtn').disabled = pages.length === 0;
    }

    document.getElementById('clearBtn').onclick = () => { pages = []; updateUI(); };

    document.getElementById('downloadBtn').onclick = () => {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        pages.forEach((src, i) => {
            if (i > 0) doc.addPage();
            doc.addImage(src, 'JPEG', 10, 10, 190, 277);
        });
        doc.save((document.getElementById('fileNameInput').value || 'scan') + '.pdf');
    };
    
    document.getElementById('compression').oninput = (e) => document.getElementById('compValue').innerText = `Minőség: ${e.target.value}`;
</script>
</body>
</html>
